name: Mirror installers from Azure

# Manual backfill / fallback. The desktop release workflow in Caven-SRC
# publishes every new installer here automatically. This workflow copies an
# existing version from the Azure release container into a GitHub release,
# under the fixed names the websites link to:
#   https://github.com/Caven-io/releases/releases/latest/download/Caven-Studio-Setup.exe
#   https://github.com/Caven-io/releases/releases/latest/download/Caven-Studio.dmg
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to mirror, e.g. 1.6.1'
        required: true

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download installers from Azure
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          base="https://recaptrreleases.blob.core.windows.net/releases"
          curl -fsSL -o Caven-Studio-Setup.exe "$base/caven-studio-${VERSION}-setup.exe"
          curl -fsSL -o Caven-Studio.dmg "$base/caven-studio-${VERSION}-universal.dmg"
          ls -l Caven-Studio-Setup.exe Caven-Studio.dmg

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          files=(Caven-Studio-Setup.exe Caven-Studio.dmg)
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Caven Studio $VERSION" --notes "Caven Studio $VERSION for Windows and macOS." --latest
          fi
